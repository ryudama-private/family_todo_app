services:
  db:
    image: postgres:16-alpine
    container_name: family-todo-db
    environment:
      POSTGRES_DB: family_todo
      POSTGRES_USER: family_todo_user
      POSTGRES_PASSWORD: family_todo_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U family_todo_user -d family_todo"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    container_name: family-todo-backend
    depends_on:
      db:
        condition: service_healthy
    environment:
      POSTGRES_DB: family_todo
      POSTGRES_USER: family_todo_user
      POSTGRES_PASSWORD: family_todo_password
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      E2E_CLEANUP_ENABLED: ${E2E_CLEANUP_ENABLED:-false}
      E2E_CLEANUP_TOKEN: ${E2E_CLEANUP_TOKEN:-}
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/')",
        ]
      interval: 5s
      timeout: 5s
      retries: 10

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    container_name: family-todo-frontend
    environment:
      CHOKIDAR_USEPOLLING: "true"
      CHOKIDAR_INTERVAL: "300"
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0 --port 5173"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:5173/ >/dev/null 2>&1"]
      interval: 5s
      timeout: 5s
      retries: 10

  e2e:
    image: mcr.microsoft.com/playwright:v1.59.1-jammy
    container_name: family-todo-e2e
    working_dir: /app
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy
    environment:
      PW_BASE_URL: "http://frontend:5173"
      PW_E2E_CLEANUP_TOKEN: ${E2E_CLEANUP_TOKEN:-}
    volumes:
      - ./frontend:/app
      - /app/node_modules
    command: sh -c "npm install && npx playwright test"

volumes:
  postgres_data:
